name: Verify HealthGuard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: >-
          docker run --rm --network none
          --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --redact=100 --no-banner
  software:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-tests-only
          POSTGRES_DB: healthguard_test
        ports: ['55432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d healthguard_test'
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-tests-only@127.0.0.1:55432/healthguard_test
      ALLOW_TEST_RESET: '1'
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.1'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install -g pnpm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --require-hashes -r ai/requirements-test.lock
      - run: pnpm verify
      - run: pnpm audit --audit-level high
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --disable-pip --no-deps -r ai/requirements.lock
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: apps/web/test-results
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install platformio==6.2.0
      - run: pio run --project-dir hardware/esp32 --environment esp32dev
      - run: pio test --project-dir hardware/esp32 --environment native
