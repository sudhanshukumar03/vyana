[platformio]
; Normal system uses all sensors; MAX-only troubleshooting is explicit -e max30102_bench.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
extra_scripts = post:scripts/sdk_intellisense.py
build_src_filter = +<*> -<bench/>
monitor_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson@6.21.6
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
	milesburton/DallasTemperature@3.11.0
	paulstoffregen/OneWire@2.3.8

[env:max30102_bench]
extends = env:esp32dev
build_src_filter = -<*> +<bench/max30102_bench.cpp> +<optical/MaximAlgorithm.cpp>
build_flags = -DMAX30102_I2C_HZ=100000UL
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2

[env:native]
platform = native@1.2.1
build_flags = -std=c++17 -Itest/test_sensors/mocks -DECG_STREAM_SERIAL=1
test_build_src = no
lib_deps = bblanchon/ArduinoJson@6.21.6

; Electrode-off USB bench: only AD8232, no network or private config.
[env:ad8232_bench]
extends = env:esp32dev
build_src_filter = -<*> +<bench/ad8232_bench.cpp>
build_flags = -DECG_STREAM_SERIAL=1
lib_deps =

; Battery-powered wireless acquisition after an electrodes-off USB upload.
[env:ad8232_wifi_bench]
extends = env:esp32dev
build_src_filter = -<*> +<bench/ad8232_wifi_bench.cpp>
lib_deps =

; Temporary A/B/A diagnostic. It does not change the production driver.
[env:max30102_verify]
extends = env:max30102_bench
build_src_filter = -<*> +<bench/max30102_verify.cpp>

; Same MAX-only code/settings, with controller error messages for diagnosis.
[env:max30102_bus_diag]
extends = env:max30102_bench
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags = -DMAX30102_I2C_HZ=100000UL -DCORE_DEBUG_LEVEL=1
