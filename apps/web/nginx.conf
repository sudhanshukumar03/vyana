server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 15m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui-avatars.com; connect-src 'self' https://overpass-api.de; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Let the API's 35-second AI deadline return a JSON fallback before proxy expiry.
    proxy_read_timeout 40s;
  }
  location /socket.io/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
