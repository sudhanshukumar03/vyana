[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthguard_ai"
version = "0.2.0"
description = "Validated wellness guidance for HealthGuard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2",
  "google-genai>=2.20,<3", "pydantic>=2.10,<3", "httpx>=0.28.1,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.setuptools]
packages = ["services"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
